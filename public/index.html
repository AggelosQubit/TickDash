    function render(state, status, events) {
      lastEvents = events;
      let info = deepDecode(state.info || {});
      syncLastLive(state, status);
      if (status?.session?.id && status.session.id !== render.sessionId) {
        matchStartWallMs = null;
        maxGameTimeSeen = 0;
        endSnapshot = null;
        endSnapshotDismissed = false;
        try {
          sessionStorage.removeItem(END_SNAPSHOT_KEY);
        } catch {
          /* ignore */
        }
        render.sessionId = status.session.id;
        for (const k of Object.keys(campKillMemory)) {
          if (!k.startsWith(`${status.session.id}:`)) delete campKillMemory[k];
        }
      }
      lastInfo = info;

      const waiting = status?.waiting || state?.waiting;
      document.getElementById("conn").textContent = waiting ? "en attente" : "live";
      document.getElementById("conn").className = waiting ? "pill" : "pill ok";
      const ow = state.ow || {};
      const owEl = document.getElementById("ow-pill");
      if (ow.featuresOk || ow.liveClient) {
        owEl.textContent = ow.source === "daemon" ? "LC ✓" : ow.liveClient ? "OW ✓" : "OW gep";
        owEl.className = "pill ok";
      } else if (ow.started) {
        owEl.textContent = "OW wait";
        owEl.className = "pill";
      } else {
        owEl.textContent = "OW —";
        owEl.className = "pill";
      }
      document.getElementById("events-pill").textContent = `${state.eventCount || 0} events`;
      document.getElementById("session-pill").textContent = status?.session?.game || (waiting ? "—" : "session");

      updateNav(info, state, status);
      updateEnemyNav(info);
      updateEndOverlay(info, events, status, state);

      if (!mounted) mountApp();
      document.getElementById("camps-body").innerHTML = campsHtml(info.jungle_camps, events, info);
      document.getElementById("strongest-ally-body").innerHTML = strongestAllyHtml(info);
      document.getElementById("strongest-body").innerHTML = strongestOpponentHtml(info);
      renderTeamLevels(info);
      document.getElementById("events-body").innerHTML = eventsHtml(events, info);
      document.getElementById("money-body").innerHTML = moneyHtml(info);
      document.getElementById("target-body").innerHTML = mainTargetsHtml(info);
      renderFinalBuild(status);
    }

    function syncLastLive(state, status) {
      const sid = status?.session?.id || null;
      if (sid !== tickSessionId) {
        tickSessionId = sid;
        lastLive = null;
      }
      if (status?.waiting && !state.livePlayers?.players?.length) {
        lastLive = null;
        return;
      }
      if (state.livePlayers?.players?.length) {
        lastLive = state.livePlayers.ok !== false ? { ok: true, ...state.livePlayers } : state.livePlayers;
        return;
      }
      if (!lastLive?.players?.length) {
        lastLive = {
          ok: false,
          error: status?.version >= 2 ? "live client unavailable" : "daemon outdated — npm start",
        };
      }
    }

    let clipBannerText = "";
    let clipBannerWidth = 0;

    function fightCall(signed) {
      if (signed == null) return { text: "EN ATTENTE", tone: "wait" };
      if (signed <= -35) return { text: `NE PEUT PAS FIGHT CURRENT PUISS DELTA : ${signed}`, tone: "no" };
      if (signed >= 35) return { text: "FIGHT ADVISED", tone: "yes" };
      return { text: "FIGHT POSSIBLE", tone: "maybe" };
    }

    function currentFightCall() {
      const info = lastInfo || {};
      const economy = liveEconomy(info);
      const myTeam = economy?.players?.length ? resolveMyTeam(economy.players, info) : null;
      const lobby = economy?.players?.length ? scoreLobbyMix(economy.players) : null;
      const pd = teamPowerDelta(lobby?.totals, myTeam);
      if (!pd) return fightCall(null);
      const signed = pd.kind === "deficit" ? -pd.amount : pd.amount;
      return fightCall(signed);
    }

    function syncClipBannerHeight() {
      const header = document.querySelector("header");
      const banner = document.getElementById("clip-banner");
      if (!header || !banner) return;
      banner.style.height = `${header.getBoundingClientRect().height}px`;
    }

    function updateClipBanner(force) {
      syncClipBannerHeight();
      const banner = document.getElementById("clip-banner");
      const track = document.getElementById("clip-track");
      const viewport = track?.parentElement;
      if (!banner || !track || !viewport) return;
      const call = currentFightCall();
      const text = call.text;
      banner.classList.remove("fight-wait", "fight-no", "fight-maybe", "fight-yes");
      banner.classList.add(`fight-${call.tone}`);
      const view = Math.max(viewport.getBoundingClientRect().width, 1);
      if (!force && text === clipBannerText && Math.abs(view - clipBannerWidth) < 8) return;
      clipBannerText = text;
      clipBannerWidth = view;
      const probe = document.createElement("span");
      probe.className = "clip-text";
      probe.textContent = text;
      track.replaceChildren(probe);
      const one = Math.max(probe.getBoundingClientRect().width, 1);
      let count = Math.ceil((view * 2) / one);
      if (count < 2) count = 2;
      if (count % 2) count += 1;
      const spans = [];
      for (let i = 0; i < count; i++) {
        const span = document.createElement("span");
        span.className = "clip-text";
        span.textContent = text;
        if (i > 0) span.setAttribute("aria-hidden", "true");
        spans.push(span);
      }
      track.replaceChildren(...spans);
      const seconds = Math.max(track.scrollWidth / 2 / 70, 8);
      track.style.animation = "none";
      void track.offsetWidth;
      track.style.animation = "";
      track.style.animationDuration = `${seconds}s`;
    }

    function escapeAttr(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    let buildKey = "";
    function renderFinalBuild(status) {
      const root = document.getElementById("build-body");
      if (!root) return;
      const build = status?.build;
      const items = build?.items || [];
      if (!items.length) {
        buildKey = "";
        root.innerHTML = `<div class="target-wait">${build?.error || "En attente du champion"}</div>`;
        return;
      }
      const key = items.map((it) => it.id).join(",");
      if (key === buildKey) return;
      buildKey = key;
      const note = [build.champion, build.role, build.patch].filter(Boolean).join(" · ");
      root.innerHTML = `<div class="build-row">${items
        .map(
          (it) =>
            `<img src="${escapeAttr(it.icon)}" alt="${escapeAttr(it.name)}" title="${escapeAttr(it.name)}">`
        )
        .join("")}</div>${note ? `<div class="build-note">${escapeAttr(note)}</div>` : ""}`;
    }

    const LOBBY_ROLE_ORDER = ["Top", "Jgl", "Mid", "Adc", "Sup"];

    function sortLobbyRows(rows) {
      return [...(rows || [])].sort((a, b) => {
        const ia = LOBBY_ROLE_ORDER.indexOf(a.position);
        const ib = LOBBY_ROLE_ORDER.indexOf(b.position);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
    }

    function splitSummoner(name) {
      const raw = name || "—";
      const cut = raw.indexOf("#");
      if (cut <= 0) return { game: raw, tag: "" };
      return { game: raw.slice(0, cut), tag: raw.slice(cut) };
    }

    function rankHead(row) {
      const label = row?.label || "—";
      const cut = label.indexOf(" · ");
      return cut < 0 ? label : label.slice(0, cut);
    }

    function renderLobbySide(root, title, rows, side) {
      const table = document.createElement("table");
      table.className = `lobby-table ${side}`;
      const caption = document.createElement("caption");
      caption.textContent = title;
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const heading of ["Rôle", "Joueur", "Rang", "LP"]) {
        const th = document.createElement("th");
        th.textContent = heading;
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      const tbody = document.createElement("tbody");
      const list = sortLobbyRows(rows);
      if (!list.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.className = "lobby-empty";
        td.textContent = side === "them" ? "Dès le début de la partie" : "En attente";
        tr.appendChild(td);
        tbody.appendChild(tr);
      } else {
        for (const row of list) {
          const tr = document.createElement("tr");
          const role = document.createElement("td");
          role.className = "role";
          role.textContent = row.position || "—";
          const who = document.createElement("td");
          who.className = "who";
          const parts = splitSummoner(row.name);
          const game = document.createElement("span");
          game.className = "game";
          game.textContent = parts.game;
          who.appendChild(game);
          if (parts.tag) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = parts.tag;
            who.appendChild(tag);
          }
          const rank = document.createElement("td");
          const tier = String(row.tier || "").toLowerCase();
          rank.className = tier ? `rank tier-${tier}` : "rank";
          rank.textContent = rankHead(row);
          const lp = document.createElement("td");
          lp.className = "lp";
          lp.textContent = row.label === "…" ? "…" : row.lp == null ? "—" : String(row.lp);
          tr.append(role, who, rank, lp);
          tbody.appendChild(tr);
        }
      }
      table.append(caption, thead, tbody);
      root.replaceChildren(table);
    }

    let lobbyRanksKey = "";
    function renderLobbyRanks(status) {
      const root = document.getElementById("lobby-ranks");
      const grid = document.getElementById("lobby-ranks-grid");
      if (!root || !grid) return;
      const ranks = status?.ranks || { allies: [], opponents: [] };
      const allies = ranks.allies || [];
      const opponents = ranks.opponents || [];
      const key = JSON.stringify({ allies, opponents });
      if (!allies.length && !opponents.length) {
        lobbyRanksKey = "";
        grid.hidden = true;
        return;
      }
      grid.hidden = false;
      if (key === lobbyRanksKey) return;
      lobbyRanksKey = key;
      renderLobbySide(document.getElementById("lobby-allies"), "Alliés", allies, "us");
      renderLobbySide(document.getElementById("lobby-opponents"), "Adversaires", opponents, "them");
    }

    const ranksReloadBtn = document.getElementById("ranks-reload");
    ranksReloadBtn.addEventListener("click", async () => {
      if (ranksReloadBtn.disabled) return;
      ranksReloadBtn.disabled = true;
      ranksReloadBtn.textContent = "Chargement…";
      try {
        const res = await fetch("/ranks/reload", { method: "POST" });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "rechargement impossible");
        lobbyRanksKey = "";
        const ranks = data.ranks || { allies: [], opponents: [] };
        if (lastStatus) lastStatus.ranks = ranks;
        renderLobbyRanks({ ranks });
      } catch (err) {
        ranksReloadBtn.textContent = "Échec";
        await new Promise((resolve) => setTimeout(resolve, 1200));
      } finally {
        ranksReloadBtn.disabled = false;
        ranksReloadBtn.textContent = "Recharger les rangs";
      }
    });

    async function tick() {
      try {
        const [stateRes, statusRes, evRes] = await Promise.all([
          fetch("/gep"),
          fetch("/status"),
          fetch("/gep/events?limit=800"),
        ]);
        if (!stateRes.ok || !statusRes.ok) throw new Error("daemon unreachable");

        const state = await stateRes.json();
        const status = await statusRes.json();
        const { events } = await evRes.json();

        offlineStreak = 0;
        syncLastLive(state, status);
        lastState = state;
        lastStatus = status;
        lastEventsCache = events;

        render(state, status, events);
        renderLobbyRanks(status);
        updateClipBanner();
      } catch (err) {
        offlineStreak += 1;
        const conn = document.getElementById("conn");
        conn.textContent = offlineStreak > 2 ? "offline" : "reconnect…";
        conn.className = "pill";

        if (mounted && lastState) {
          render(lastState, lastStatus, lastEventsCache);
          updateClipBanner();
          return;
        }

        if (!mounted) {
          document.getElementById("app").innerHTML =
            `<div class="waiting">Daemon offline — lance <code>npm start</code> ou <code>restart-daemon.bat</code><br/><small>${err.message}</small></div>`;
        }
      }
    }

    updateClipBanner(true);
    window.addEventListener("resize", () => updateClipBanner(true));

    tick();
    setInterval(tick, 1000);

    fetch("/items-completed.json")
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data?.completed) return;
        itemsCompletedDico = data.completed;
        itemsCompletedPatch = data.patch || null;
        if (lastState) render(lastState, lastStatus, lastEventsCache);
      })
      .catch(() => {});

    document.getElementById("end-overlay").addEventListener("click", (ev) => {
      if (ev.target.closest(".end-close")) openPostmortemPage();
    });
  </script>
</body>
</html>
