<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TickDash — GEP Live</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #121722;
      --border: #252b3a;
      --text: #e6eaf2;
      --muted: #8b93a7;
      --accent: #c8aa6e;
      --green: #3dd68c;
      --red: #f07178;
      --blue: #59c2ff;
      --power: #9d8cff;
      --power-dim: #7c6bb8;
      --power-up: #6ee7d7;
      --power-down: #ff9ecd;
      --team-us: #3dd68c;
      --team-them: #ff9f43;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #151b28, var(--panel));
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .nav-stats {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      padding: 4px 0;
    }
    .nav-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
      font-size: 14px;
    }
    .nav-stat .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .nav-stat .value { font-weight: 600; font-size: 15px; }
    .nav-stat.kda .value .k { color: var(--green); }
    .nav-stat.kda .value .d { color: var(--red); }
    .nav-stat.kda .value .a { color: var(--blue); }
    .nav-stat.player .value { color: var(--text); font-size: 16px; }
    .nav-stat.player .sub { color: var(--accent); font-weight: 500; font-size: 14px; }
    .nav-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      flex-shrink: 0;
    }
    .nav-end {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .enemy-nav {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: #0e121a;
      display: flex;
      align-items: stretch;
      gap: 14px;
      overflow-x: auto;
      flex-shrink: 0;
      min-height: 88px;
    }
    .lobby-ranks {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: #10151f;
      flex-shrink: 0;
    }
    .lobby-ranks-bar {
      display: flex;
      justify-content: flex-end;
    }
    .ranks-reload {
      appearance: none;
      border: 1px solid #3a4458;
      background: #1a2230;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      font: 600 13px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    .ranks-reload:hover { border-color: var(--accent); color: var(--accent); }
    .ranks-reload:disabled { opacity: 0.6; cursor: default; }
    .lobby-ranks-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .lobby-ranks-grid[hidden] { display: none; }
    .lobby-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      background: #121722;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .lobby-table.us { box-shadow: inset 3px 0 0 var(--team-us); }
    .lobby-table.them { box-shadow: inset 3px 0 0 var(--team-them); }
    .lobby-table caption {
      caption-side: top;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 12px 2px;
      background: #121722;
    }
    .lobby-table.us caption { color: var(--team-us); }
    .lobby-table.them caption { color: var(--team-them); }
    .lobby-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 12px 8px;
      border-bottom: 1px solid var(--border);
      background: #121722;
    }
    .lobby-table th:nth-child(1) { width: 64px; }
    .lobby-table th:nth-child(3) { width: 132px; }
    .lobby-table th:nth-child(4) { width: 64px; text-align: right; }
    .lobby-table td {
      padding: 8px 12px;
      font-size: 15px;
      border-top: 1px solid #1c2330;
      vertical-align: middle;
      background: #121722;
    }
    .lobby-table tbody tr:nth-child(odd) td { background: #171d2a; }
    .lobby-table td.role {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .lobby-table td.who {
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lobby-table td.who .tag {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      margin-left: 6px;
    }
    .lobby-table td.rank {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }
    .lobby-table td.lp {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
    }
    .lobby-table td.lobby-empty {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      padding: 16px 12px;
    }
    .tier-iron { color: #b7c0d0; }
    .tier-bronze { color: #e0a07a; }
    .tier-silver { color: #e4eaf3; }
    .tier-gold { color: #f0d078; }
    .tier-platinum { color: #7ad4d4; }
    .tier-emerald { color: #5ee0a0; }
    .tier-diamond { color: #9ec8ff; }
    .tier-master { color: #d2b0ff; }
    .tier-grandmaster { color: #ff9a92; }
    .tier-challenger { color: #ffe7a8; }
    .enemy-nav-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding-right: 4px;
    }
    .enemy-nav-label strong { color: #ffaaaa; font-weight: 700; font-size: 13px; }
    .enemy-nav-timers {
      display: flex;
      align-items: stretch;
      gap: 10px;
      flex: 1;
      min-width: 0;
      width: 100%;
    }
    .enemy-chip {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #141a26;
      text-align: center;
    }
    .enemy-chip.alive {
      border-color: #2a4a3a;
      background: #101820;
    }
    .enemy-chip.dead {
      border-color: #5a3038;
      background: linear-gradient(180deg, #1a1218, #141018);
    }
    .enemy-chip .champ {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .enemy-chip .role {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .enemy-chip .timer {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 30px;
      font-weight: 800;
      color: var(--red);
      line-height: 1;
      margin-top: 2px;
    }
    .enemy-chip .timer.soon { color: var(--accent); }
    .enemy-chip .timer.up { font-size: 15px; color: var(--green); font-weight: 700; }
    .enemy-nav-wait {
      font-size: 14px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }
    .enemy-nav-summary {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding-left: 4px;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 999px;
      background: #1a2130;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .pill.ok { color: var(--green); border-color: #2a5c44; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 8px 10px;
      max-width: none;
      margin: 0;
    }
    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .live-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
      min-width: 0;
      flex: 1;
      min-height: 0;
    }
    .live-row .card {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .live-row .card .card-body.scroll-pane {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      max-height: none;
    }
    .live-row .card.events-col .events-panel .card-body.scroll-pane {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      max-height: none;
    }
    .live-row .card .card-body.scroll-pane > .scroll-inner {
      min-height: min-content;
    }
    @media (max-width: 1100px) {
      .live-row { flex-direction: column; }
      .live-row .card .card-body { max-height: none; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .card h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #0f131c;
    }
    .card-body { padding: 8px 10px; }
    .player-name { font-size: 22px; font-weight: 600; }
    .champion { color: var(--accent); font-size: 16px; margin-top: 2px; }
    .kda .k { color: var(--green); }
    .kda .d { color: var(--red); }
    .kda .a { color: var(--blue); }
    .camp-list { display: flex; flex-direction: column; gap: 6px; }
    .camp-neutral-block { margin-bottom: 4px; }
    .camp-river-block { margin-top: 10px; }
    .camp-jungle-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .camp-jungle-row .camp-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    @media (max-width: 900px) {
      .camp-jungle-row { flex-direction: column; }
    }
    .camp-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 4px 0 2px;
    }
    .camp-group-title.blue { color: #6eb5ff; }
    .camp-group-title.red { color: #ff8a8a; }
    .camp {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      background: #0d1119;
      border-radius: 6px;
      font-size: 13px;
    }
    .camp .dot {
      width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
    }
    .camp .dot.alive { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .camp .dot.dead { background: var(--red); opacity: 0.7; }
    .camp-left { display: flex; align-items: center; min-width: 0; gap: 8px; }
    .camp-name { font-weight: 600; }
    .side-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1a2130;
      color: var(--muted);
      white-space: nowrap;
    }
    .side-badge.blue { color: #8ec5ff; border: 1px solid #2a4a6a; }
    .side-badge.red { color: #ffaaaa; border: 1px solid #6a3a3a; }
    .side-badge.neutral { color: var(--muted); border: 1px solid #2a3144; }
    .camp-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 11px;
      text-align: right;
    }
    .camp-clock-hint {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 8px;
      background: #0d1119;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .camp-respawn {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 17px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
    }
    .camp-respawn.soon { color: var(--green); }
    .camp-event {
      color: var(--accent);
      font-family: ui-monospace, Consolas, monospace;
    }
    .camp-event.cleared { color: var(--red); }
    .camp-event.up { color: var(--green); }
    .camp-status { color: var(--muted); }
    .events {
      overflow: hidden;
      font-size: 12px;
    }
    .card.events-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .strongest-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .strongest-panel {
      flex: 0 0 auto;
      background: linear-gradient(180deg, #141a28, #0f131c);
    }
    .strongest-row .strongest-panel { border-bottom: none; }
    .strongest-panel + .strongest-panel { border-left: 1px solid var(--border); }
    .strongest-panel h2 {
      margin: 0;
      padding: 6px 14px 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
    }
    .level-sum {
      margin: 0;
      padding: 10px 14px 0;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .level-sum.us { color: var(--team-us); }
    .level-sum.them { color: var(--team-them); }
    .strongest-panel.opponent h2 {
      color: #ffaaaa;
      background: #120f18;
    }
    .strongest-panel.ally h2 {
      color: #aaccff;
      background: #0f1418;
    }
    .strongest-body { padding: 6px 8px; }
    .strongest-wait { font-size: 12px; color: var(--muted); }
    .strongest-hero { display: flex; flex-direction: column; gap: 6px; }
    .strongest-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .strongest-champ {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
    }
    .strongest-role {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 2px 8px;
      border: 1px solid #4a3038;
      border-radius: 4px;
    }
    .strongest-dead {
      font-size: 10px;
      font-weight: 800;
      color: var(--red);
      background: #281518;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .strongest-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .strongest-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px;
      background: #0d1119;
      border-radius: 8px;
      border: 1px solid #1a2030;
    }
    .strongest-stat.highlight {
      border-color: #5a4040;
      background: linear-gradient(180deg, #1a1218, #0d1119);
    }
    .strongest-stat .lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }
    .strongest-stat .val {
      font-size: 18px;
      font-weight: 800;
      font-family: ui-monospace, Consolas, monospace;
      color: var(--text);
    }
    .strongest-stat.highlight .val {
      color: var(--accent);
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(200, 170, 110, 0.4);
    }
    .strongest-stat .sub { font-size: 10px; color: var(--muted); }
    .strongest-rank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .strongest-other {
      padding: 3px 8px;
      background: #0d1119;
      border-radius: 4px;
      border: 1px solid #1a2030;
    }
    .strongest-other small {
      color: var(--accent);
      font-weight: 800;
      font-size: 12px;
      text-shadow: 0 0 8px rgba(200, 170, 110, 0.35);
    }
    .power-val {
      color: var(--accent);
      font-weight: 800;
      font-size: 13px;
      font-family: ui-monospace, Consolas, monospace;
      text-shadow: 0 0 8px rgba(200, 170, 110, 0.35);
    }
    .end-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 8, 12, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    .end-overlay[hidden] { display: none; }
    .end-card {
      width: min(920px, 100%);
      background: #101622;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }
    .end-head {
      padding: 20px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .end-head.victory { background: linear-gradient(180deg, #152818, #101622); }
    .end-head.defeat { background: linear-gradient(180deg, #281518, #101622); }
    .end-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .end-head.victory .end-title { color: #7fd4a8; }
    .end-head.defeat .end-title { color: #ff9a9a; }
    .end-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
    .end-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .end-stat .lbl { font-size: 10px; text-transform: uppercase; color: var(--muted); }
    .end-stat .val { font-size: 22px; font-weight: 800; color: var(--accent); }
    .end-stat .val.benefit { color: var(--green); }
    .end-stat .val.deficit { color: var(--red); }
    .end-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    .end-team h3 {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .end-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .end-row.me { background: #171322; outline: 1px solid #4a3058; }
    .end-row .mix { font-size: 16px; font-weight: 800; color: var(--accent); }
    .end-close {
      display: block;
      width: 100%;
      padding: 12px;
      border: 0;
      border-top: 1px solid var(--border);
      background: #141a28;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }
    .end-close:hover { color: var(--text); background: #1a2130; }
    .strongest-proxy {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }
    .events-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .events-panel h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #0f131c;
    }
    .event {
      padding: 5px 8px;
      border-bottom: 1px solid #1a2030;
      display: grid;
      grid-template-columns: 52px 64px 1fr;
      gap: 6px;
      align-items: center;
    }
    .event .t { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
    .event-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 6px;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
    }
    .event-tag.kill { background: #152818; color: var(--green); }

<body>
  <header>
    <div class="nav-brand">
      <h1>TickDash</h1>
